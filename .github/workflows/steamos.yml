name: SteamOS (Steam Frame / Steam Deck) build & release

on:
  push:
    branches: [steamos]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        mode: [lan, wan, combined]
        arch: [x64, arm64]
        include:
          - { mode: lan, label: LAN }
          - { mode: wan, label: WAN }
          - { mode: combined, label: Combined }
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version from pubspec.yaml
        shell: bash
        run: |
          echo "VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libpulse-dev file
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter config --no-analytics && flutter pub get
      - run: flutter build linux --release --dart-define=LV_MODE=${{ matrix.mode }} --dart-define=LV_VERSION=${{ env.VERSION }}
      - name: Package (tar.gz, AppImage)
        run: |
          M="${{ matrix.label }}"
          D=Localview-$M-steamos-${{ matrix.arch }}
          B=$(ls -d build/linux/*/release/bundle)
          cp -r "$B" "$D"
          cp assets/icon.png "$D/localview.png"
          tar czf "$D.tar.gz" "$D"
          AIARCH=$([ "${{ matrix.arch }}" = arm64 ] && echo aarch64 || echo x86_64)
          sh installer/build-appimage.sh "$B" "${{ matrix.mode }}" "$M" "$AIARCH" "$D.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: steamos-${{ matrix.mode }}-${{ matrix.arch }}
          path: |
            Localview-*.tar.gz
            Localview-*.AppImage
            localview-*.deb
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pubspec.yaml
          sparse-checkout-cone-mode: false
      - name: Read version from pubspec.yaml
        shell: bash
        run: |
          echo "VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Remove the old per-platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete steamos-v1.0.0 --cleanup-tag -y --repo "${{ github.repository }}" || true
      - name: Publish to the shared release
        id: publish
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: main
          name: Localview ${{ env.VERSION }}
          make_latest: true
          overwrite_files: true
          files: dist/*
          body: |
            One release for every platform. Pick your device, then a variant:
            
            * **Combined** (recommended): nearby devices are listed automatically and anything you connect to once is saved to *My devices*, reachable from anywhere.
            * **LAN**: lists devices on the same router; connect with the password set on that device.
            * **WAN**: add a device by IP + password; a pairing key is stored on both devices.
            
            | Device | Installer | Portable |
            |---|---|---|
            | Windows 10/11 x64 | `Localview-<variant>-windows-x64-setup.exe` | `…-windows-x64.zip` |
            | macOS (Apple Silicon + Intel) | `Localview-<variant>-macos.dmg` | `…-macos-universal.zip` |
            | Linux x64 / arm64 | `localview-<variant>_<version>_<arch>.deb` | `…-linux-<arch>.AppImage`, `…-linux-<arch>.tar.gz` |
            | SteamOS: Steam Frame (arm64), Steam Deck (x64) | `Localview-<variant>-steamos-<arch>.AppImage` | `…-steamos-<arch>.tar.gz` |
            | Android phones/tablets | `Localview-<variant>-android.apk` | |
            | Android TV / Google TV | `Localview-<variant>-android-tv.apk` | |
            | Android XR & Meta Quest | `Localview-<variant>-android-xr.apk` | |
            | iOS / iPadOS (sideload) | `Localview-<variant>-ios-unsigned.ipa` | |
            
            Everything is end-to-end encrypted (X25519 + ChaCha20-Poly1305; game mode media is DTLS-SRTP keyed through that channel).
            **Game mode** streams Windows/macOS/Linux PCs with hardware H.264 video, system audio and controller passthrough (up to 4K60 / 1080p120).
      - name: Retry (another platform may have created the release at the same moment)
        if: steps.publish.outcome == 'failure'
        run: sleep 30
      - if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: main
          name: Localview ${{ env.VERSION }}
          make_latest: true
          overwrite_files: true
          files: dist/*
