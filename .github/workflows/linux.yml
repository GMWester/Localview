name: Linux build & release

on:
  push:
    branches: [linux]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Read version from pubspec.yaml
        shell: bash
        run: |
          echo "VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y xvfb libx11-dev libxtst-dev xdotool
      - run: flutter pub get
      - run: flutter analyze
      - run: xvfb-run -a flutter test

  vr-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: PC VR frame path test (fake compositor -> import -> NV12 -> ffmpeg -> decode, on lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libvulkan-dev glslang-tools libunwind-dev libdrm-dev libx11-dev libxrandr-dev mesa-vulkan-drivers ffmpeg
          cmake -S vr/driver -B vr/build -DCMAKE_BUILD_TYPE=Release -DLV_BUILD_TESTS=ON
          cmake --build vr/build -j"$(nproc)"
          mkdir -p "$RUNNER_TEMP/lvrt"
          vr/build/lv_pipeline_test "$RUNNER_TEMP/lvrt"

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        mode: [lan, wan, combined]
        arch: [x64, arm64]
        include:
          - { mode: lan, label: LAN }
          - { mode: wan, label: WAN }
          - { mode: combined, label: Combined }
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version from pubspec.yaml
        shell: bash
        run: |
          echo "VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libpulse-dev file rpm
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter config --no-analytics && flutter pub get
      - run: flutter build linux --release --dart-define=LV_MODE=${{ matrix.mode }} --dart-define=LV_VERSION=${{ env.VERSION }} --dart-define=LV_FLAVOR=linux
      - name: PC VR SteamVR driver + compositor capture layer (x64 - SteamVR for Linux is x64 only)
        if: matrix.arch == 'x64'
        run: |
          sudo apt-get install -y libvulkan-dev glslang-tools libunwind-dev libdrm-dev libx11-dev libxrandr-dev
          cmake -S vr/driver -B vr/build -DCMAKE_BUILD_TYPE=Release
          cmake --build vr/build -j"$(nproc)"
          test -f vr/driver/localview/bin/linux64/driver_localview.so
          B=$(ls -d build/linux/*/release/bundle)
          mkdir -p "$B/vr/linux/layer"
          cp -r vr/driver/localview "$B/vr/"
          cp vr/linux/vrcompositor-wrapper.sh vr/linux/LICENSE-ALVR vr/linux/README.md "$B/vr/linux/"
          cp vr/linux/layer/localview_capture.json.in vr/linux/layer/LICENSE-Arm "$B/vr/linux/layer/"
      - name: Package (tar.gz, AppImage, .deb, .rpm)
        run: |
          M="${{ matrix.label }}"
          D=Localview-$M-linux-${{ matrix.arch }}
          B=$(ls -d build/linux/*/release/bundle)
          cp -r "$B" "$D"
          cp assets/icon.png "$D/localview.png"
          tar czf "$D-$VERSION.tar.gz" "$D"
          AIARCH=$([ "${{ matrix.arch }}" = arm64 ] && echo aarch64 || echo x86_64)
          sh installer/build-appimage.sh "$B" "${{ matrix.mode }}" "$M" "$AIARCH" "$D-$VERSION.AppImage"
          DEBARCH=$([ "${{ matrix.arch }}" = arm64 ] && echo arm64 || echo amd64)
          sh installer/build-deb.sh "$B" "${{ matrix.mode }}" "${{ matrix.label }}" "$DEBARCH" "$VERSION" "localview-${{ matrix.mode }}_${VERSION}_${DEBARCH}.deb"
          RPMARCH=$([ "${{ matrix.arch }}" = arm64 ] && echo aarch64 || echo x86_64)
          sh installer/build-rpm.sh "$B" "${{ matrix.mode }}" "${{ matrix.label }}" "$RPMARCH" "$VERSION" "localview-${{ matrix.mode }}-${VERSION}-1.${RPMARCH}.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.mode }}-${{ matrix.arch }}
          path: |
            Localview-*.tar.gz
            Localview-*.AppImage
            localview-*.deb
            localview-*.rpm
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pubspec.yaml
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Read version from pubspec.yaml
        shell: bash
        run: |
          echo "VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"
      - name: Never add an update to an older release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SRC=$(git log -1 --format=%B | sed -n 's/^Source-Commit: *//p' | head -1)
          [ -n "$SRC" ] || SRC=unknown
          echo "SOURCE_COMMIT=$SRC" >> "$GITHUB_ENV"
          BODY=$(gh release view "v$VERSION" --repo "${{ github.repository }}" --json body -q .body 2>/dev/null || true)
          OLD=$(printf '%s' "$BODY" | sed -n 's/^Source-Commit: *//p' | head -1)
          if [ -n "$BODY" ] && [ "$OLD" != "$SRC" ]; then
            echo "::error::Release v$VERSION already exists for another update ($OLD). Raise 'version:' in pubspec.yaml so this update gets its own release."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Remove the old per-platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete linux-v1.0.0 --cleanup-tag -y --repo "${{ github.repository }}" || true
      - name: Release notes (changelog section + downloads table)
        run: |
          {
            echo "## What's new in $VERSION"
            awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md | sed '/^$/d'
            echo
            cat <<'NOTES'
            > **Easiest way to install: get the [Localview Installer](https://github.com/GMWester/LocalViewInstaller/releases/latest).** Pick your device, processor and version in the app and it downloads, installs and launches the right Localview for you — no need to find the matching file below.
            
            One release for every platform; every file name ends with the version (`<version>`, e.g. `1.4.0`). Pick your device, then a variant:
            
            * **Combined** (recommended): nearby devices are listed automatically and anything you connect to once is saved to *My devices*, reachable from anywhere.
            * **LAN**: lists devices on the same router; connect with the password set on that device.
            * **WAN**: add a device by IP + password; a pairing key is stored on both devices.
            
            | Device | Installer | Portable |
            |---|---|---|
            | Windows 10/11 x64 | `Localview-<variant>-windows-x64-setup-<version>.exe` | `…-windows-x64-<version>.zip` |
            | Windows 11 on ARM (Snapdragon, Surface Pro X) | `Localview-<variant>-windows-arm64-setup-<version>.exe` | `…-windows-arm64-<version>.zip` |
            | macOS (Apple Silicon + Intel) | `Localview-<variant>-macos-<version>.dmg` | `…-macos-universal-<version>.zip` |
            | Linux x64 / arm64 | `localview-<variant>_<version>_<arch>.deb` (Debian/Ubuntu), `localview-<variant>-<version>-1.<arch>.rpm` (Fedora/RHEL/openSUSE) | `…-linux-<arch>-<version>.AppImage`, `…-linux-<arch>-<version>.tar.gz` |
            | SteamOS: Steam Frame (arm64), Steam Deck (x64) | `Localview-<variant>-steamos-<arch>-<version>.AppImage` | `…-steamos-<arch>-<version>.tar.gz` |
            | Android phones/tablets (Android 7.0+) | `Localview-<variant>-android-<version>.apk` (all processors) | per processor: `…-android-arm64-<version>.apk`, `…-android-armv7-<version>.apk` (older 32-bit devices), `…-android-x86_64-<version>.apk` |
            | Android Pro (real mouse & keyboard when controlled) | `Localview-<variant>-android-pro-<version>.apk` | per processor: `…-android-pro-arm64-<version>.apk`, `…-android-pro-armv7-<version>.apk`, `…-android-pro-x86_64-<version>.apk` |
            | Android TV / Google TV | `Localview-<variant>-android-tv-<version>.apk` (all processors) | per processor: `…-android-tv-armv7-<version>.apk` (most TVs), `…-android-tv-arm64-<version>.apk`, `…-android-tv-x86_64-<version>.apk` |
            | Android XR & Meta Quest | `Localview-<variant>-android-xr-<version>.apk` (all processors) | per processor: `…-android-xr-arm64-<version>.apk` (Quest 2/3/3S/Pro, Android XR), `…-android-xr-armv7-<version>.apk` (older 32-bit headsets, Android 10+), `…-android-xr-x86_64-<version>.apk` (Android XR emulator) |
            | iOS / iPadOS (sideload) | `Localview-<variant>-ios-unsigned-<version>.ipa` | |
            
            Everything is end-to-end encrypted (X25519 + ChaCha20-Poly1305; game mode media is DTLS-SRTP keyed through that channel).
            **Game mode** streams Windows/macOS/Linux PCs with hardware H.264 video, system audio and controller passthrough (up to 4K60 / 1080p120).
            **PC VR** streams SteamVR games to Meta Quest and Android XR headsets from a Windows, Linux (x64) or SteamOS PC, including Windows VR games running through Proton.
          NOTES
            echo
            echo "Source-Commit: $SOURCE_COMMIT"
          } > release-notes.md
          cat release-notes.md
      - name: Publish to the shared release
        id: publish
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: main
          name: Localview ${{ env.VERSION }}
          make_latest: true
          overwrite_files: true
          files: dist/*
          body_path: release-notes.md
      - name: Retry (another platform may have created the release at the same moment)
        if: steps.publish.outcome == 'failure'
        run: sleep 30
      - if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: main
          name: Localview ${{ env.VERSION }}
          make_latest: true
          overwrite_files: true
          files: dist/*
