name: macOS build & release

on:
  push:
    branches: [macos]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [lan, wan, combined]
        include:
          - { mode: lan, label: LAN }
          - { mode: wan, label: WAN }
          - { mode: combined, label: Combined }
    steps:
      - uses: actions/checkout@v4
      - name: Read version from pubspec.yaml
        shell: bash
        run: |
          echo "VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Variant name and bundle id
        run: |
          M="${{ matrix.label }}"
          sed -i '' "s/^PRODUCT_NAME = .*/PRODUCT_NAME = Localview $M/" macos/Runner/Configs/AppInfo.xcconfig
          sed -i '' "s/^PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = io.localview.localview.${{ matrix.mode }}/" macos/Runner/Configs/AppInfo.xcconfig
      - run: flutter pub get
      - run: flutter build macos --release --dart-define=LV_MODE=${{ matrix.mode }} --dart-define=LV_VERSION=${{ env.VERSION }}
      - name: Package (zip + dmg)
        run: |
          M="${{ matrix.label }}"
          APP="build/macos/Build/Products/Release/Localview $M.app"
          codesign --force --deep -s - "$APP"
          ditto -c -k --keepParent "$APP" "Localview-$M-macos-universal.zip"
          sh installer/build-dmg.sh "$APP" "Localview $M" "Localview-$M-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.mode }}
          path: |
            Localview-*-macos-universal.zip
            Localview-*-macos.dmg
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pubspec.yaml
          sparse-checkout-cone-mode: false
      - name: Read version from pubspec.yaml
        shell: bash
        run: |
          echo "VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"
      - name: Never add an update to an older release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SRC=$(git log -1 --format=%B | sed -n 's/^Source-Commit: *//p' | head -1)
          [ -n "$SRC" ] || SRC=unknown
          echo "SOURCE_COMMIT=$SRC" >> "$GITHUB_ENV"
          BODY=$(gh release view "v$VERSION" --repo "${{ github.repository }}" --json body -q .body 2>/dev/null || true)
          OLD=$(printf '%s' "$BODY" | sed -n 's/^Source-Commit: *//p' | head -1)
          if [ -n "$BODY" ] && [ "$OLD" != "$SRC" ]; then
            echo "::error::Release v$VERSION already exists for another update ($OLD). Raise 'version:' in pubspec.yaml so this update gets its own release."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Remove the old per-platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete macos-v1.0.0 --cleanup-tag -y --repo "${{ github.repository }}" || true
      - name: Publish to the shared release
        id: publish
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: main
          name: Localview ${{ env.VERSION }}
          make_latest: true
          overwrite_files: true
          files: dist/*
          body: |
            One release for every platform. Pick your device, then a variant:
            
            * **Combined** (recommended): nearby devices are listed automatically and anything you connect to once is saved to *My devices*, reachable from anywhere.
            * **LAN**: lists devices on the same router; connect with the password set on that device.
            * **WAN**: add a device by IP + password; a pairing key is stored on both devices.
            
            | Device | Installer | Portable |
            |---|---|---|
            | Windows 10/11 x64 | `Localview-<variant>-windows-x64-setup.exe` | `…-windows-x64.zip` |
            | macOS (Apple Silicon + Intel) | `Localview-<variant>-macos.dmg` | `…-macos-universal.zip` |
            | Linux x64 / arm64 | `localview-<variant>_<version>_<arch>.deb` | `…-linux-<arch>.AppImage`, `…-linux-<arch>.tar.gz` |
            | SteamOS: Steam Frame (arm64), Steam Deck (x64) | `Localview-<variant>-steamos-<arch>.AppImage` | `…-steamos-<arch>.tar.gz` |
            | Android phones/tablets | `Localview-<variant>-android.apk` | |
            | Android TV / Google TV | `Localview-<variant>-android-tv.apk` | |
            | Android XR & Meta Quest | `Localview-<variant>-android-xr.apk` | |
            | iOS / iPadOS (sideload) | `Localview-<variant>-ios-unsigned.ipa` | |
            
            Everything is end-to-end encrypted (X25519 + ChaCha20-Poly1305; game mode media is DTLS-SRTP keyed through that channel).
            **Game mode** streams Windows/macOS/Linux PCs with hardware H.264 video, system audio and controller passthrough (up to 4K60 / 1080p120).

            Source-Commit: ${{ env.SOURCE_COMMIT }}
      - name: Retry (another platform may have created the release at the same moment)
        if: steps.publish.outcome == 'failure'
        run: sleep 30
      - if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: main
          name: Localview ${{ env.VERSION }}
          make_latest: true
          overwrite_files: true
          files: dist/*
