name: macOS build & release

on:
  push:
    branches: [macos]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        mode: [lan, wan]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Variant name and bundle id
        run: |
          M=$(echo ${{ matrix.mode }} | tr a-z A-Z)
          sed -i '' "s/^PRODUCT_NAME = .*/PRODUCT_NAME = Localview $M/" macos/Runner/Configs/AppInfo.xcconfig
          sed -i '' "s/^PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = io.localview.localview.${{ matrix.mode }}/" macos/Runner/Configs/AppInfo.xcconfig
      - run: flutter pub get
      - run: flutter build macos --release --dart-define=LV_MODE=${{ matrix.mode }}
      - name: Package
        run: |
          M=$(echo ${{ matrix.mode }} | tr a-z A-Z)
          cd build/macos/Build/Products/Release
          codesign --force --deep -s - "Localview $M.app"
          ditto -c -k --keepParent "Localview $M.app" "$GITHUB_WORKSPACE/Localview-$M-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.mode }}
          path: Localview-*-macos-universal.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-v1.0.0
          target_commitish: ${{ github.sha }}
          name: Localview 1.0.0 — macOS
          make_latest: false
          files: dist/*
          body: |
            macOS 10.15+ (Apple Silicon and Intel). Unzip, move to Applications, right-click → Open the first time (ad-hoc signed). Grant Screen Recording and Accessibility in System Settings to be controlled. Remote drives appear in Finder.

            **LAN** builds list devices on the same router; pick one and type the password set on it.
            **WAN** builds connect over the internet: press **+**, enter the other device's IP and password; a pairing key is generated and stored on both devices.
            Both variants are end-to-end encrypted (X25519 + ChaCha20-Poly1305). Both devices must run the same variant.
