name: Windows build & release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [lan, wan, combined]
        include:
          - { mode: lan, label: LAN }
          - { mode: wan, label: WAN }
          - { mode: combined, label: Combined }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=LV_MODE=${{ matrix.mode }}
      - name: Build the SteamVR driver (PC VR)
        shell: pwsh
        run: |
          cmake -S vr/driver -B vr/build -A x64
          cmake --build vr/build --config Release
          if (!(Test-Path vr\driver\localview\bin\win64\driver_localview.dll)) { throw "driver build failed" }
      - name: Portable zip
        shell: pwsh
        run: |
          $m = "${{ matrix.label }}"
          $dir = "Localview-$m-windows-x64"
          Copy-Item -Recurse build\windows\x64\runner\Release $dir
          New-Item -ItemType Directory -Force "$dir\vr" | Out-Null
          Copy-Item -Recurse vr\driver\localview "$dir\vr\localview"
          Rename-Item "$dir\localview.exe" "Localview $m.exe"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - name: Fetch the ViGEmBus controller driver installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo nefarius/ViGEmBus --pattern "*.exe" --dir vigem
          if ($LASTEXITCODE -ne 0) { Write-Host "ViGEmBus download failed; installer will not include it"; exit 0 }
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $m = "${{ matrix.label }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $src = (Resolve-Path "Localview-$m-windows-x64").Path
          $isargs = @("/DAppLabel=$m", "/DAppMode=${{ matrix.mode }}", "/DAppVersion=1.0.0", "/DSourceDir=$src", "/DOutputBase=Localview-$m-windows-x64-setup")
          $vig = Get-ChildItem vigem -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vig) { $isargs += "/DVigemInstaller=$($vig.FullName)" }
          & $iscc @isargs installer\windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "installer\Localview-$m-windows-x64-setup.exe" .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.mode }}
          path: |
            Localview-*-windows-x64.zip
            Localview-*-windows-x64-setup.exe
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Remove the old per-platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete windows-v1.0.0 --cleanup-tag -y --repo "${{ github.repository }}" || true
      - name: Publish to the shared release
        id: publish
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: main
          name: Localview 1.0.0
          make_latest: true
          overwrite_files: true
          files: dist/*
          body: |
            One release for every platform. Pick your device, then a variant:
            
            * **Combined** (recommended): nearby devices are listed automatically and anything you connect to once is saved to *My devices*, reachable from anywhere.
            * **LAN**: lists devices on the same router; connect with the password set on that device.
            * **WAN**: add a device by IP + password; a pairing key is stored on both devices.
            
            | Device | Installer | Portable |
            |---|---|---|
            | Windows 10/11 x64 | `Localview-<variant>-windows-x64-setup.exe` | `…-windows-x64.zip` |
            | macOS (Apple Silicon + Intel) | `Localview-<variant>-macos.dmg` | `…-macos-universal.zip` |
            | Linux x64 / arm64 | `localview-<variant>_1.0.0_<arch>.deb` | `…-linux-<arch>.AppImage`, `…-linux-<arch>.tar.gz` |
            | SteamOS: Steam Frame (arm64), Steam Deck (x64) | `Localview-<variant>-steamos-<arch>.AppImage` | `…-steamos-<arch>.tar.gz` |
            | Android phones/tablets | `Localview-<variant>-android.apk` | |
            | Android TV / Google TV | `Localview-<variant>-android-tv.apk` | |
            | Android XR & Meta Quest | `Localview-<variant>-android-xr.apk` | |
            | iOS / iPadOS (sideload) | `Localview-<variant>-ios-unsigned.ipa` | |
            
            Everything is end-to-end encrypted (X25519 + ChaCha20-Poly1305; game mode media is DTLS-SRTP keyed through that channel).
            **Game mode** streams Windows/macOS/Linux PCs with hardware H.264 video, system audio and controller passthrough (up to 4K60 / 1080p120).
      - name: Retry (another platform may have created the release at the same moment)
        if: steps.publish.outcome == 'failure'
        run: sleep 30
      - if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: main
          name: Localview 1.0.0
          make_latest: true
          overwrite_files: true
          files: dist/*
