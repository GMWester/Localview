name: Windows build & release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        mode: [lan, wan, combined]
        arch: [x64, arm64]
        include:
          - { mode: lan, label: LAN }
          - { mode: wan, label: WAN }
          - { mode: combined, label: Combined }
    steps:
      - uses: actions/checkout@v4
      - name: Read version from pubspec.yaml
        shell: bash
        run: |
          echo "VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Flutter for Windows ARM64 (built from the 3.50.0 tag; no prebuilt arm64 SDK is published)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git C:\flutter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\flutter\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          C:\flutter\bin\flutter.bat --version
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=LV_MODE=${{ matrix.mode }} --dart-define=LV_VERSION=${{ env.VERSION }}
      - name: Build the SteamVR driver (PC VR, x64 only - SteamVR has no ARM64 version)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          cmake -S vr/driver -B vr/build -A x64
          cmake --build vr/build --config Release
          if (!(Test-Path vr\driver\localview\bin\win64\driver_localview.dll)) { throw "driver build failed" }
      - name: Portable zip
        shell: pwsh
        run: |
          $m = "${{ matrix.label }}"
          $a = "${{ matrix.arch }}"
          $dir = "Localview-$m-windows-$a"
          Copy-Item -Recurse "build\windows\$a\runner\Release" $dir
          if ($a -eq "x64") {
            New-Item -ItemType Directory -Force "$dir\vr" | Out-Null
            Copy-Item -Recurse vr\driver\localview "$dir\vr\localview"
          }
          Rename-Item "$dir\localview.exe" "Localview $m.exe"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - name: Fetch the ViGEmBus controller driver installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo nefarius/ViGEmBus --pattern "*.exe" --dir vigem
          if ($LASTEXITCODE -ne 0) { Write-Host "ViGEmBus download failed; installer will not include it"; exit 0 }
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $m = "${{ matrix.label }}"
          $a = "${{ matrix.arch }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $src = (Resolve-Path "Localview-$m-windows-$a").Path
          $isargs = @("/DAppLabel=$m", "/DAppMode=${{ matrix.mode }}", "/DAppVersion=$env:VERSION", "/DArch=$a", "/DSourceDir=$src", "/DOutputBase=Localview-$m-windows-$a-setup")
          $vig = Get-ChildItem vigem -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vig) { $isargs += "/DVigemInstaller=$($vig.FullName)" }
          & $iscc @isargs installer\windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "installer\Localview-$m-windows-$a-setup.exe" .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.mode }}-${{ matrix.arch }}
          path: |
            Localview-*-windows-*.zip
            Localview-*-windows-*-setup.exe
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pubspec.yaml
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Read version from pubspec.yaml
        shell: bash
        run: |
          echo "VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"
      - name: Never add an update to an older release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SRC=$(git log -1 --format=%B | sed -n 's/^Source-Commit: *//p' | head -1)
          [ -n "$SRC" ] || SRC=unknown
          echo "SOURCE_COMMIT=$SRC" >> "$GITHUB_ENV"
          BODY=$(gh release view "v$VERSION" --repo "${{ github.repository }}" --json body -q .body 2>/dev/null || true)
          OLD=$(printf '%s' "$BODY" | sed -n 's/^Source-Commit: *//p' | head -1)
          if [ -n "$BODY" ] && [ "$OLD" != "$SRC" ]; then
            echo "::error::Release v$VERSION already exists for another update ($OLD). Raise 'version:' in pubspec.yaml so this update gets its own release."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Remove the old per-platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete windows-v1.0.0 --cleanup-tag -y --repo "${{ github.repository }}" || true
      - name: Release notes (changelog section + downloads table)
        run: |
          {
            echo "## What's new in $VERSION"
            awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md | sed '/^$/d'
            echo
            cat <<'NOTES'
            > **Easiest way to install: get the [Localview Installer](https://github.com/GMWester/LocalViewInstaller/releases/latest).** Pick your device, processor and version in the app and it downloads, installs and launches the right Localview for you — no need to find the matching file below.
            
            One release for every platform. Pick your device, then a variant:
            
            * **Combined** (recommended): nearby devices are listed automatically and anything you connect to once is saved to *My devices*, reachable from anywhere.
            * **LAN**: lists devices on the same router; connect with the password set on that device.
            * **WAN**: add a device by IP + password; a pairing key is stored on both devices.
            
            | Device | Installer | Portable |
            |---|---|---|
            | Windows 10/11 x64 | `Localview-<variant>-windows-x64-setup.exe` | `…-windows-x64.zip` |
            | Windows 11 on ARM (Snapdragon, Surface Pro X) | `Localview-<variant>-windows-arm64-setup.exe` | `…-windows-arm64.zip` |
            | macOS (Apple Silicon + Intel) | `Localview-<variant>-macos.dmg` | `…-macos-universal.zip` |
            | Linux x64 / arm64 | `localview-<variant>_<version>_<arch>.deb` (Debian/Ubuntu), `localview-<variant>-<version>-1.<arch>.rpm` (Fedora/RHEL/openSUSE) | `…-linux-<arch>.AppImage`, `…-linux-<arch>.tar.gz` |
            | SteamOS: Steam Frame (arm64), Steam Deck (x64) | `Localview-<variant>-steamos-<arch>.AppImage` | `…-steamos-<arch>.tar.gz` |
            | Android phones/tablets (Android 7.0+) | `Localview-<variant>-android.apk` (all processors) | per processor: `…-android-arm64.apk`, `…-android-armv7.apk` (older 32-bit devices), `…-android-x86_64.apk` |
            | Android TV / Google TV | `Localview-<variant>-android-tv.apk` (all processors) | per processor: `…-android-tv-armv7.apk` (most TVs), `…-android-tv-arm64.apk`, `…-android-tv-x86_64.apk` |
            | Android XR & Meta Quest | `Localview-<variant>-android-xr.apk` (all processors) | per processor: `…-android-xr-arm64.apk` (Quest 2/3/3S/Pro, Android XR), `…-android-xr-armv7.apk` (older 32-bit headsets, Android 10+), `…-android-xr-x86_64.apk` (Android XR emulator) |
            | iOS / iPadOS (sideload) | `Localview-<variant>-ios-unsigned.ipa` | |
            
            Everything is end-to-end encrypted (X25519 + ChaCha20-Poly1305; game mode media is DTLS-SRTP keyed through that channel).
            **Game mode** streams Windows/macOS/Linux PCs with hardware H.264 video, system audio and controller passthrough (up to 4K60 / 1080p120).
            **PC VR** streams SteamVR games to Meta Quest and Android XR headsets from a Windows, Linux (x64) or SteamOS PC, including Windows VR games running through Proton.
          NOTES
            echo
            echo "Source-Commit: $SOURCE_COMMIT"
          } > release-notes.md
          cat release-notes.md
      - name: Publish to the shared release
        id: publish
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: main
          name: Localview ${{ env.VERSION }}
          make_latest: true
          overwrite_files: true
          files: dist/*
          body_path: release-notes.md
      - name: Retry (another platform may have created the release at the same moment)
        if: steps.publish.outcome == 'failure'
        run: sleep 30
      - if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: main
          name: Localview ${{ env.VERSION }}
          make_latest: true
          overwrite_files: true
          files: dist/*
