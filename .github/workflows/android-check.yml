name: Android build check (dev branch, no release)

on:
  push:
    branches: [claude/eloquent-darwin-2m7gti]
    paths: ['android/**', 'lib/**', 'tool/android-pro/**', 'pubspec.yaml', 'pubspec.lock', '.github/workflows/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [android, android-pro]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Localview Pro files
        if: matrix.flavor == 'android-pro'
        run: |
          cp tool/android-pro/ProBridge.kt tool/android-pro/ProInputServer.kt android/app/src/main/kotlin/io/localview/localview/
          printf '%s\n' '-keep class io.localview.localview.ProInputServer { *; }' >> android/app/proguard-rules.pro
      - run: flutter pub get
      - name: Release APK (ARM64, temporary key - only checks that it builds)
        run: flutter build apk --release --target-platform android-arm64 --dart-define=LV_MODE=combined --dart-define=LV_FLAVOR=${{ matrix.flavor }} -P lvMode=combined
