name: iOS build & release

on:
  push:
    branches: [ios]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        mode: [lan, wan, combined]
        include:
          - { mode: lan, label: LAN }
          - { mode: wan, label: WAN }
          - { mode: combined, label: Combined }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Variant name and bundle id
        run: |
          M="${{ matrix.label }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Localview $M" ios/Runner/Info.plist
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = io.localview.localview;/PRODUCT_BUNDLE_IDENTIFIER = io.localview.localview.${{ matrix.mode }};/" ios/Runner.xcodeproj/project.pbxproj
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=LV_MODE=${{ matrix.mode }}
      - name: Package unsigned IPA
        run: |
          M="${{ matrix.label }}"
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "Localview-$M-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.mode }}
          path: Localview-*-ios-unsigned.ipa

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v1.0.0
          target_commitish: ${{ github.sha }}
          name: Localview 1.0.0 — iOS
          make_latest: false
          files: dist/*
          body: |
            iOS/iPadOS 13+. Unsigned IPA: install with AltStore, Sideloadly or your own Apple developer signing. iOS can control other devices and share its Localview folder; iOS does not allow apps to be remotely controlled.

            **LAN** builds list devices on the same router; pick one and type the password set on it.
            **Combined** builds do both in one app: nearby devices are listed automatically, and a device you connect to once on the LAN is also saved to *My devices* so you can reach it from anywhere. Combined works with LAN and WAN builds too.
            **WAN** builds connect over the internet: press **+**, enter the other device's IP and password; a pairing key is generated and stored on both devices.
            Both variants are end-to-end encrypted (X25519 + ChaCha20-Poly1305). LAN and WAN builds need the same variant on both devices (or Combined on either side).
